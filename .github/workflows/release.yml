name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.os }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/rust-space-cleaner.exe" dist/
            cd dist && zip -r "rust-space-cleaner-${{ github.ref_name }}-${{ matrix.target }}.zip" rust-space-cleaner.exe
          else
            cp "target/${{ matrix.target }}/release/rust-space-cleaner" dist/
            tar -C dist -czf "dist/rust-space-cleaner-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" rust-space-cleaner
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true